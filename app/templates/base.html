<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}Radar Management{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<header class="header">
    <div class="header-content">

        <div class="header-left">
            <button
                type="button"
                class="back-button"
                onclick="goBack()"
                title="Назад"
            >
                ←
            </button>

            <div class="logo">
                RADAR MANAGEMENT
            </div>
        </div>

        <nav class="navigation">
            <a href="/web/"
               class="nav-link {% if request.url.path in ['/web', '/web/'] %}active{% endif %}">
                Главная
            </a>

            <a href="/web/companies/"
               class="nav-link {% if request.url.path.startswith('/web/companies') %}active{% endif %}">
                Мои компании
            </a>

            <a href="/web/ranked/"
               class="nav-link {% if request.url.path.startswith('/web/ranked') %}active{% endif %}">
                AI рейтинг
            </a>
        </nav>

    </div>
</header>


<script>
function goBack() {
    if (window.history.length > 1 && document.referrer !== "") {
        window.history.back();
    } else {
        window.location.href = "/web/";
    }
}
</script>


<main class="main-content">

    {% block content %}
    {% endblock %}

</main>


</body>
</html>
